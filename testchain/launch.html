<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>afterglow</title>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #0e1116;
        --sunk: #11151b;
        --line: #1e2732;
        --fg: #c8ced8;
        --bright: #e6ebf2;
        --dim: #7c8798;
        --faint: #4d5765;
        --ok: #7fd0a0;
        --bad: #d08a7f;
        --warn: #d8c07f;
        --sans: "Segoe UI", system-ui, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 var(--sans);
      }
      #brand {
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        text-align: center;
      }
      #brand b {
        color: var(--bright);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      #ramBox {
        overflow: hidden;
        padding: 5px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--sunk);
        color: var(--ok);
        font: 11px/1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid var(--line);
        border-top-color: var(--ok);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
      }
      #state,
      #out {
        display: none;
      }
      body.done #spin,
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: var(--ok);
        font-weight: 700;
        letter-spacing: 2px;
      }
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 14px 18px 30px;
      }
      body.log #state {
        display: block;
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }
      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--sunk);
        font: 12px/1.45 var(--mono);
        white-space: pre-wrap;
      }
      .notice {
        margin: 1em 0;
        padding: 0.7em 1em;
        border: 2px solid #e66;
        background: #2a1414;
        color: #f99;
        font: 700 20px/1.4 var(--sans);
      }
      .byline {
        position: fixed;
        bottom: 9px;
        left: 11px;
        margin: 0;
        color: var(--faint);
        font: 11px/1 var(--mono);
        letter-spacing: 0.06em;
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
      }
      code {
        color: #9fb3d0;
      }
      #sendLog {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 1000;
        padding: 8px 14px;
        background: #111;
        color: #7fd0a0;
        border: 1px solid #7fd0a0;
        border-radius: 4px;
        font: 700 12px/1 var(--mono);
        letter-spacing: 0.08em;
      }
      #sendLog:active { background: #1f3a2a; }
      #scanPanel {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 1000;
        display: none;
        gap: 8px;
        padding: 8px;
        background: #080a0c;
        border: 1px solid #7fd0a0;
        color: #c8ced8;
        font: 12px/1.3 var(--mono);
      }
      #scanPanel button {
        padding: 7px 10px;
        background: #111;
        color: #7fd0a0;
        border: 1px solid #7fd0a0;
        border-radius: 3px;
        font: 700 11px/1 var(--mono);
      }
      #scanPanel button:disabled { opacity: 0.4; }
    </style>
  </head>
  <body>
    <div id="brand"><b>afterglow</b></div>
    <div id="ramBox">RAM: checking...</div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">by well0nez/m0zz</p>
    <div id="scanPanel">
      <span id="scanStage">scan: waiting for kernel</span>
      <button id="scanStart" disabled>START</button>
      <button id="scanNext" disabled>NEXT</button>
    </div>
    <button id="sendLog">SEND LOG</button>
    <script type="module">
      import "./jb-g.js?v=1402zh6";
    </script>
    <script>
      document.getElementById("sendLog").addEventListener("click", function () {
        var out = document.getElementById("out");
        var text = out ? out.textContent : "";
        if (!text) text = "(no log lines captured)";
        fetch("ag_log", { method: "POST", body: text, cache: "no-store" })
          .then(function (r) {
            document.getElementById("sendLog").textContent =
              r.ok ? "SENT" : "FAILED " + r.status;
          })
          .catch(function () {
            document.getElementById("sendLog").textContent = "FAILED";
          });
      });

      (function () {
        var params = new URLSearchParams(location.search);
        if (params.get("scan") !== "1") return;
        var panel = document.getElementById("scanPanel");
        var stageEl = document.getElementById("scanStage");
        var startBtn = document.getElementById("scanStart");
        var nextBtn = document.getElementById("scanNext");
        var stage = 0, STEP = 0x400000, MAX = 12, busy = false;
        panel.style.display = "flex";

        function ready() {
          return window.__AG_SCAN && window.__AG_IFACE && window.__AG_IFACE.base;
        }

        function update() {
          stageEl.textContent = "scan stage " + (stage + 1) + "/" + MAX +
            " @" + (stage * STEP / 0x100000) + " MiB";
          startBtn.disabled = busy || stage >= MAX;
          nextBtn.disabled = busy || stage >= MAX;
        }

        async function run() {
          if (busy || stage >= MAX) return;
          if (!ready()) {
            stageEl.textContent = "scan: waiting for kernel";
            return;
          }
          busy = true; update();
          var b = window.__AG_IFACE.base;
          try {
            await window.__AG_SCAN(b.low, b.hi, stage * STEP, STEP);
          } catch (e) {
            stageEl.textContent = "scan error: " + (e && e.message ? e.message : e);
          }
          busy = false;
          stage++;
          update();
        }

        startBtn.addEventListener("click", run);
        nextBtn.addEventListener("click", run);
        var wait = setInterval(function () {
          if (ready()) {
            clearInterval(wait);
            startBtn.disabled = false;
            nextBtn.disabled = false;
            update();
          }
        }, 500);
        update();
      })();
    </script>
  </body>
</html>
